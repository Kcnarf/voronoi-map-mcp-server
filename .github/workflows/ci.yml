name: CI

# Runs on every push and every pull request
on:
  push:
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}.x
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      # Check out the repository code
      - uses: actions/checkout@v4

      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # Install dependencies (uses yarn.lock for reproducibility)
      - run: yarn install --frozen-lockfile

      # Run the test suite
      - run: yarn test
