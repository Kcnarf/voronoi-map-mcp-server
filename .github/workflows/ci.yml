name: CI

# Runs on every push and every pull request
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - uses: actions/checkout@v4

      # Set up Node.js 20 LTS
      - uses: actions/setup-node@v4
        with:
          node-version: [18,20]
          cache: yarn

      # Install dependencies (uses yarn.lock for reproducibility)
      - run: yarn install --frozen-lockfile

      # Run the test suite
      - run: yarn test
